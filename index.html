<!DOCTYPE html>

<html lang="no">


<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>
        CleanPlan - Logg inn
    </title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>


<body class="landing-body">


<!-- ============================================================
     LANDING PAGE
     ============================================================ -->

<main class="landing-page">


    <!-- ========================================================
         TOP BAR
         ======================================================== -->

    <header class="landing-header">


        <!-- ====================================================
             BRAND
             ==================================================== -->

        <div class="landing-brand">

            <span class="landing-brand-icon">
                🧹
            </span>

            <span>
                CleanPlan
            </span>

        </div>


        <!-- ====================================================
             HEADER ACTIONS
             ==================================================== -->

        <div class="landing-header-actions">


            <!-- =================================================
                 LOGIN BUTTON
                 ================================================= -->

            <button
                    type="button"
                    class="landing-header-login-button"
                    id="openLoginButton"
                    aria-haspopup="dialog"
                    aria-controls="loginModal"
                    aria-expanded="false"
            >

                <span data-i18n="login">
                    Logg inn
                </span>

            </button>


            <!-- =================================================
                 SMALL LANGUAGE SWITCHER
                 ================================================= -->

            <div
                    class="language-switcher"
                    id="languageSwitcher"
            >


                <!-- CURRENT LANGUAGE -->

                <button
                        type="button"
                        class="language-current"
                        id="languageCurrentButton"
                        aria-expanded="false"
                        aria-haspopup="true"
                        data-i18n-aria-label="languageSelectorAria"
                >

                    <span
                            class="language-current-flag"
                            id="currentLanguageFlag"
                    >
                        🇳🇴
                    </span>

                    <span
                            class="language-current-code"
                            id="currentLanguageCode"
                    >
                        NO
                    </span>

                    <span class="language-current-arrow">
                        ▾
                    </span>

                </button>


                <!-- =================================================
                     LANGUAGE MENU
                     ================================================= -->

                <div
                        class="language-menu"
                        id="languageMenu"
                        role="listbox"
                        hidden
                >


                    <!-- NORWEGIAN -->

                    <button
                            type="button"
                            class="language-option"
                            data-language="no"
                            role="option"
                            aria-selected="true"
                    >

                        <span class="language-option-flag">
                            🇳🇴
                        </span>

                        <span class="language-option-code">
                            NO
                        </span>

                    </button>


                    <!-- ENGLISH -->

                    <button
                            type="button"
                            class="language-option"
                            data-language="en"
                            role="option"
                            aria-selected="false"
                    >

                        <span class="language-option-flag">
                            🇬🇧
                        </span>

                        <span class="language-option-code">
                            EN
                        </span>

                    </button>


                </div>


            </div>


        </div>


    </header>


    <!-- ========================================================
         CONTENT
         ======================================================== -->

    <section class="landing-content landing-content-without-login">


        <!-- ====================================================
             LEFT SIDE
             ==================================================== -->

        <div class="landing-info">


            <h1>

                <span data-i18n="landingTitleLine1">
                    Hold rengjøringen
                </span>

                <br>

                <span data-i18n="landingTitleLine2">
                    enkel og oversiktlig
                </span>

            </h1>


            <p class="landing-description">

                <span data-i18n="landingDescription">
                    Hold oversikt over oppgaver, ansvar og utført rengjøring – på ett sted.
                </span>

            </p>


            <!-- =================================================
                 BENEFITS
                 ================================================= -->

            <div class="landing-benefits">


                <div class="benefit-item">

                    <span class="benefit-check">
                        ✓
                    </span>

                    <span data-i18n="benefitPlan">
                        Se din rengjøringsplan
                    </span>

                </div>


                <div class="benefit-item">

                    <span class="benefit-check">
                        ✓
                    </span>

                    <span data-i18n="benefitDocument">
                        Dokumenter utført rengjøring
                    </span>

                </div>


                <div class="benefit-item">

                    <span class="benefit-check">
                        ✓
                    </span>

                    <span data-i18n="benefitResidents">
                        Samarbeid med andre beboere
                    </span>

                </div>


            </div>


            <!-- =================================================
                 FEATURE CARDS
                 ================================================= -->

            <div class="landing-features">


                <div class="feature-card">

                    <span class="feature-icon">
                        🏠
                    </span>

                    <span
                            class="feature-label"
                            data-i18n="properties"
                    >
                        Boliger
                    </span>

                </div>


                <div class="feature-card">

                    <span class="feature-icon">
                        🧹
                    </span>

                    <span
                            class="feature-label"
                            data-i18n="cleaningPlan"
                    >
                        Rengjøringsplan
                    </span>

                </div>


                <div class="feature-card">

                    <span class="feature-icon">
                        📷
                    </span>

                    <span
                            class="feature-label"
                            data-i18n="documentation"
                    >
                        Dokumentasjon
                    </span>

                </div>


                <div class="feature-card">

                    <span class="feature-icon">
                        🔄
                    </span>

                    <span
                            class="feature-label"
                            data-i18n="swapTasks"
                    >
                        Bytte oppgaver
                    </span>

                </div>


            </div>


        </div>


    </section>


</main>


<!-- ============================================================
     LOGIN MODAL
     ============================================================ -->

<div
        id="loginModal"
        class="landing-login-modal"
        role="dialog"
        aria-modal="true"
        aria-labelledby="loginModalTitle"
        hidden
>


    <!-- ========================================================
         MODAL BACKDROP
         ======================================================== -->

    <div
            id="loginModalBackdrop"
            class="landing-login-modal-backdrop"
    ></div>


    <!-- ========================================================
         LOGIN CARD
         ======================================================== -->

    <section class="landing-login-card landing-login-modal-card">


        <!-- ====================================================
             CLOSE BUTTON
             ==================================================== -->

        <button
                type="button"
                id="closeLoginButton"
                class="landing-login-modal-close"
                aria-label="Lukk innlogging"
                data-i18n-aria-label="closeLogin"
        >
            ×
        </button>


        <!-- ====================================================
             TITLE
             ==================================================== -->

        <h2
                id="loginModalTitle"
                data-i18n="login"
        >
            Logg inn
        </h2>


        <!-- ====================================================
             LOGIN FORM
             ==================================================== -->

        <form id="loginForm">


            <!-- =================================================
                 EMAIL
                 ================================================= -->

            <div class="landing-form-group">

                <label
                        for="email"
                        data-i18n="email"
                >
                    E-post
                </label>


                <div class="landing-input-wrapper">

                    <span class="landing-input-icon">
                        ✉
                    </span>


                    <input
                            type="email"
                            id="email"
                            placeholder="din@epost.no"
                            data-i18n-placeholder="emailPlaceholder"
                            autocomplete="email"
                            required
                    >

                </div>

            </div>


            <!-- =================================================
                 PASSWORD
                 ================================================= -->

            <div class="landing-form-group">

                <label
                        for="password"
                        data-i18n="password"
                >
                    Passord
                </label>


                <div class="landing-input-wrapper">

                    <span class="landing-input-icon">
                        🔒
                    </span>


                    <input
                            type="password"
                            id="password"
                            placeholder="Ditt passord"
                            data-i18n-placeholder="passwordPlaceholder"
                            autocomplete="current-password"
                            required
                    >

                </div>

            </div>


            <!-- =================================================
     LOGIN BUTTON
     ================================================= -->

            <button
                    type="submit"
                    class="landing-login-button"
                    id="loginButton"
                    data-i18n="loginUppercase"
            >
                LOGG INN
            </button>


        </form>


        <!-- =================================================
             DIVIDER
             ================================================= -->

        <div class="login-divider">

            <span></span>


            <span
                    class="login-divider-text"
                    data-i18n="or"
            >
                eller
            </span>


            <span></span>

        </div>


        <!-- =================================================
             FORGOT PASSWORD
             ================================================= -->

        <button
                type="button"
                class="landing-forgot-button"
                id="forgotPasswordButton"
                data-i18n="forgotPassword"
        >
            Glemt passord?
        </button>


        <!-- =================================================
             MESSAGE
             ================================================= -->

        <p
                id="loginMessage"
                class="message"
                role="alert"
                aria-live="polite"
        ></p>


    </section>


</div>


<!-- ============================================================
     SUPABASE
     ============================================================ -->

<script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- ============================================================
     SUPABASE CONFIG
     ============================================================ -->

<script src="js/config.js"></script>


<!-- ============================================================
     LANGUAGE
     Load before auth so translations are available immediately
     ============================================================ -->

<script src="js/language.js?v=12"></script>


<!-- ============================================================
     AUTH
     ============================================================ -->

<script src="js/auth.js?v=3"></script>


</body>

</html>
