<!DOCTYPE html>

<html lang="no">


<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title
            data-i18n-title="adminFloorsPageTitle"
    >
        CleanPlan - Etasjer
    </title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>


<body class="admin-dashboard-body">


<!-- =========================================================
     SIDEBAR OVERLAY
     ========================================================= -->

<div
        id="adminSidebarOverlay"
        class="admin-sidebar-overlay"
        hidden
></div>


<!-- =========================================================
     ADMIN LAYOUT
     ========================================================= -->

<div class="admin-layout">


    <!-- =====================================================
         SIDEBAR
         ===================================================== -->

    <aside
            id="adminSidebar"
            class="admin-sidebar"
    >


        <!-- =================================================
             BRAND
             ================================================= -->

        <div class="admin-sidebar-brand">

            <div class="admin-sidebar-brand-icon">
                🧹
            </div>

            <strong>
                CleanPlan
            </strong>

        </div>


        <!-- =================================================
             ROLE
             ================================================= -->

        <div
                class="admin-sidebar-role"
                data-i18n="adminRoleLabel"
        >
            ADMIN
        </div>


        <!-- =================================================
             NAVIGATION
             ================================================= -->

        <nav class="admin-sidebar-nav">


            <!-- DASHBOARD -->

            <a
                    href="admin.html"
                    class="admin-sidebar-link"
            >

                <span class="admin-sidebar-link-icon">
                    ▦
                </span>

                <span data-i18n="adminDashboard">
                    Dashboard
                </span>

            </a>


            <!-- PROPERTIES -->

            <a
                    href="properties.html"
                    class="admin-sidebar-link"
            >

                <span class="admin-sidebar-link-icon">
                    🏠
                </span>

                <span data-i18n="adminProperties">
                    Boliger
                </span>

            </a>


            <!-- FLOORS -->

            <a
                    href="properties.html"
                    class="admin-sidebar-link active"
            >

                <span class="admin-sidebar-link-icon">
                    ▤
                </span>

                <span data-i18n="adminFloors">
                    Etasjer
                </span>

            </a>


            <!-- RESIDENTS -->

            <a
                    href="admin-residents.html"
                    class="admin-sidebar-link"
            >

                <span class="admin-sidebar-link-icon">
                    👥
                </span>

                <span data-i18n="adminResidents">
                    Beboere
                </span>

            </a>


            <!-- CLEANING PLAN -->

            <a
                    href="admin-cleaning-plan.html"
                    class="admin-sidebar-link"
            >

                <span class="admin-sidebar-link-icon">
                    🧹
                </span>

                <span data-i18n="adminCleaningPlan">
                    Rengjøringsplan
                </span>

            </a>


            <!-- USERS -->

            <a
                    href="users.html"
                    class="admin-sidebar-link"
            >

                <span class="admin-sidebar-link-icon">
                    👤
                </span>

                <span data-i18n="adminUsers">
                    Brukere
                </span>

            </a>


            <!-- HISTORY -->

            <button
                    id="historyButton"
                    class="admin-sidebar-link admin-sidebar-button"
                    type="button"
            >

                <span class="admin-sidebar-link-icon">
                    ↻
                </span>

                <span data-i18n="adminHistory">
                    Historikk
                </span>

            </button>


            <!-- SETTINGS -->

            <button
                    id="settingsButton"
                    class="admin-sidebar-link admin-sidebar-button"
                    type="button"
            >

                <span class="admin-sidebar-link-icon">
                    ⚙
                </span>

                <span data-i18n="adminSettings">
                    Innstillinger
                </span>

            </button>


        </nav>


        <!-- =================================================
             LOGOUT
             ================================================= -->

        <div class="admin-sidebar-footer">

            <button
                    id="logoutButton"
                    class="admin-sidebar-logout"
                    type="button"
            >

                <span>
                    ↪
                </span>

                <span data-i18n="adminLogout">
                    Logg ut
                </span>

            </button>

        </div>


    </aside>


    <!-- =====================================================
         MAIN AREA
         ===================================================== -->

    <div class="admin-main-area">


        <!-- =================================================
             TOP HEADER
             ================================================= -->

        <header class="admin-top-header">


            <!-- MOBILE MENU -->

            <button
                    id="adminMobileMenuButton"
                    class="admin-mobile-menu-button"
                    type="button"
                    aria-label="Åpne meny"
                    data-i18n-aria-label="adminOpenMenu"
            >
                ☰
            </button>


            <!-- =================================================
                 RIGHT SIDE
                 ================================================= -->

            <div class="admin-header-profile">


                <!-- PROFILE -->

                <div class="admin-header-profile-text">

                    <strong id="adminName">
                        Administrator
                    </strong>

                    <span id="adminRole">
                        Admin
                    </span>

                </div>


                <!-- =================================================
                     SMALL LANGUAGE SWITCHER
                     ================================================= -->

                <div
                        class="language-switcher"
                        id="languageSwitcher"
                >

                    <button
                            type="button"
                            class="language-current"
                            id="languageCurrentButton"
                            aria-expanded="false"
                            aria-haspopup="true"
                            data-i18n-aria-label="languageSelectorAria"
                    >

                        <span
                                class="language-current-flag"
                                id="currentLanguageFlag"
                        >
                            🇳🇴
                        </span>

                        <span
                                class="language-current-code"
                                id="currentLanguageCode"
                        >
                            NO
                        </span>

                        <span class="language-current-arrow">
                            ▾
                        </span>

                    </button>


                    <div
                            class="language-menu"
                            id="languageMenu"
                            role="listbox"
                            hidden
                    >

                        <button
                                type="button"
                                class="language-option"
                                data-language="no"
                                role="option"
                                aria-selected="true"
                        >

                            <span class="language-option-flag">
                                🇳🇴
                            </span>

                            <span class="language-option-code">
                                NO
                            </span>

                        </button>


                        <button
                                type="button"
                                class="language-option"
                                data-language="en"
                                role="option"
                                aria-selected="false"
                        >

                            <span class="language-option-flag">
                                🇬🇧
                            </span>

                            <span class="language-option-code">
                                EN
                            </span>

                        </button>

                    </div>


                </div>


                <!-- AVATAR -->

                <div
                        class="admin-header-avatar"
                        id="adminInitial"
                        aria-hidden="true"
                >
                    A
                </div>


            </div>


        </header>


        <!-- =================================================
             CONTENT
             ================================================= -->

        <main class="admin-content">


            <!-- =================================================
                 PAGE HEADER
                 ================================================= -->

            <section class="admin-page-header">


                <p
                        class="admin-page-eyebrow"
                        data-i18n="adminAdministratorEyebrow"
                >
                    ADMINISTRATOR
                </p>


                <h1>

                    <span aria-hidden="true">
                        🏢
                    </span>

                    <span data-i18n="adminFloors">
                        Etasjer
                    </span>

                </h1>


                <p id="propertyInfo">

                    <span data-i18n="adminLoadingProperty">
                        Laster bolig...
                    </span>

                </p>


                <button
                        id="backButton"
                        class="secondary-button"
                        type="button"
                >

                    <span aria-hidden="true">
                        ←
                    </span>

                    <span data-i18n="adminBackToProperties">
                        Tilbake til boliger
                    </span>

                </button>


            </section>


            <!-- =================================================
                 FLOORS LAYOUT
                 ================================================= -->

            <div class="admin-properties-layout">


                <!-- =================================================
                     ADD FLOOR
                     ================================================= -->

                <section class="dashboard-card">


                    <div class="admin-section-icon">
                        🏢
                    </div>


                    <h2 data-i18n="adminAddFloor">
                        Legg til etasje
                    </h2>


                    <p
                            class="section-description"
                            data-i18n="adminAddFloorDescription"
                    >
                        Opprett en etasje for denne boligen.
                    </p>


                    <form id="floorForm">


                        <!-- FLOOR NUMBER -->

                        <div class="form-group">

                            <label
                                    for="floorNumber"
                                    data-i18n="adminFloorNumber"
                            >
                                Etasjenummer
                            </label>


                            <input
                                    id="floorNumber"
                                    name="floorNumber"
                                    type="number"
                                    min="1"
                                    step="1"
                                    required
                            >

                        </div>


                        <!-- FLOOR NAME -->

                        <div class="form-group">

                            <label
                                    for="floorName"
                                    data-i18n="adminFloorName"
                            >
                                Navn på etasje
                            </label>


                            <input
                                    id="floorName"
                                    name="floorName"
                                    type="text"
                                    placeholder="For eksempel 1. etasje"
                                    data-i18n-placeholder="adminFloorNamePlaceholder"
                                    maxlength="100"
                                    required
                            >

                        </div>

                        <!-- SAVE FLOOR -->

                        <button
                                id="saveFloorButton"
                                class="primary-button"
                                type="submit"
                        >

                            <span aria-hidden="true">
                                +
                            </span>

                            <span data-i18n="adminSaveFloor">
                                Lagre etasje
                            </span>

                        </button>


                        <!-- MESSAGE -->

                        <p
                                id="floorMessage"
                                class="message"
                                aria-live="polite"
                        ></p>


                    </form>


                </section>


                <!-- =================================================
                     FLOORS LIST
                     ================================================= -->

                <section class="dashboard-card">


                    <div class="section-header">

                        <div>


                            <div class="admin-section-icon">
                                ▤
                            </div>


                            <h2 data-i18n="adminFloors">
                                Etasjer
                            </h2>


                            <p
                                    class="section-description"
                                    data-i18n="adminRegisteredFloors"
                            >
                                Registrerte etasjer
                            </p>


                        </div>

                    </div>


                    <!-- =================================================
                         FLOOR LIST
                         Dynamic content from floors.js
                         ================================================= -->

                    <div id="floorList">

                        <p
                                class="empty-state"
                                data-i18n="adminLoadingFloors"
                        >
                            Laster etasjer...
                        </p>

                    </div>


                </section>


            </div>


        </main>


    </div>


</div>


<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<!-- =========================================================
     CONFIG
     ========================================================= -->

<script src="js/config.js"></script>


<!-- =========================================================
     LANGUAGE
     IMPORTANT:
     language.js must load before floors.js
     ========================================================= -->

<script src="js/language.js?v=12"></script>


<!-- =========================================================
     FLOORS JAVASCRIPT
     ========================================================= -->

<script src="js/floors.js"></script>


<!-- =========================================================
     SIDEBAR JAVASCRIPT
     ========================================================= -->

<script>

    document.addEventListener(
        "DOMContentLoaded",
        function () {


            // =================================================
            // ELEMENTS
            // =================================================

            const sidebar =
                document.getElementById(
                    "adminSidebar"
                );


            const overlay =
                document.getElementById(
                    "adminSidebarOverlay"
                );


            const mobileMenuButton =
                document.getElementById(
                    "adminMobileMenuButton"
                );


            const historyButton =
                document.getElementById(
                    "historyButton"
                );


            const settingsButton =
                document.getElementById(
                    "settingsButton"
                );


            // =================================================
            // TRANSLATION HELPER
            // =================================================

            function adminTranslate(
                key,
                fallback
            ) {

                if (
                    window.CleanPlanI18n &&
                    typeof window.CleanPlanI18n.t ===
                    "function"
                ) {

                    const translated =
                        window.CleanPlanI18n.t(
                            key
                        );


                    if (
                        translated &&
                        translated !==
                        key
                    ) {

                        return translated;

                    }

                }


                return fallback;

            }


            // =================================================
            // OPEN SIDEBAR
            // =================================================

            function openSidebar() {

                if (
                    !sidebar ||
                    !overlay
                ) {

                    return;

                }


                sidebar.classList.add(
                    "open"
                );


                overlay.hidden =
                    false;

            }


            // =================================================
            // CLOSE SIDEBAR
            // =================================================

            function closeSidebar() {

                if (
                    !sidebar ||
                    !overlay
                ) {

                    return;

                }


                sidebar.classList.remove(
                    "open"
                );


                overlay.hidden =
                    true;

            }


            // =================================================
            // MOBILE MENU
            // =================================================

            if (
                mobileMenuButton
            ) {

                mobileMenuButton.addEventListener(
                    "click",
                    function () {

                        if (
                            sidebar &&
                            sidebar.classList.contains(
                                "open"
                            )
                        ) {

                            closeSidebar();

                        } else {

                            openSidebar();

                        }

                    }
                );

            }


            // =================================================
            // OVERLAY
            // =================================================

            if (
                overlay
            ) {

                overlay.addEventListener(
                    "click",
                    closeSidebar
                );

            }

            // =================================================
            // HISTORY
            // =================================================

            if (
                historyButton
            ) {

                historyButton.addEventListener(
                    "click",
                    function () {

                        window.alert(
                            adminTranslate(
                                "adminHistoryComingSoon",
                                "Historikk kommer i et senere steg."
                            )
                        );

                    }
                );

            }


            // =================================================
            // SETTINGS
            // =================================================

            if (
                settingsButton
            ) {

                settingsButton.addEventListener(
                    "click",
                    function () {

                        window.alert(
                            adminTranslate(
                                "adminSettingsComingSoon",
                                "Innstillinger kommer i et senere steg."
                            )
                        );

                    }
                );

            }


            // =================================================
            // ESCAPE
            // =================================================

            document.addEventListener(
                "keydown",
                function (
                    event
                ) {

                    if (
                        event.key ===
                        "Escape"
                    ) {

                        closeSidebar();

                    }

                }
            );


            // =================================================
            // DESKTOP RESIZE
            // =================================================

            window.addEventListener(
                "resize",
                function () {

                    if (
                        window.innerWidth >
                        900
                    ) {

                        closeSidebar();

                    }

                }
            );


        }
    );

</script>


</body>


</html>
