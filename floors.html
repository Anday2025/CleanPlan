
<!DOCTYPE html>
<html lang="no">

<head>

  <meta charset="UTF-8">

  <meta
          name="viewport"
          content="width=device-width, initial-scale=1.0"
  >

  <title>Cleaning App - Etasjer</title>

  <link
          rel="stylesheet"
          href="css/style.css"
  >

</head>


<body>


<!-- =========================================================
     TOPBAR
     ========================================================= -->

<header class="topbar">

  <div>
    <strong>🧹 Cleaning App</strong>
  </div>


  <div class="topbar-right">

        <span id="adminName">
            Admin
        </span>


    <button
            id="logoutButton"
            class="logout-button"
            type="button"
    >
      Logg ut
    </button>

  </div>

</header>



<!-- =========================================================
     MAIN
     ========================================================= -->

<main class="dashboard">


  <!-- =====================================================
       PAGE HEADER
       ===================================================== -->

  <section class="welcome-card">

    <p class="eyebrow">
      ADMINISTRATOR
    </p>


    <h1>
      🏢 Etasjer
    </h1>


    <p id="propertyInfo">
      Laster bolig...
    </p>


    <button
            id="backButton"
            class="secondary-button"
            type="button"
    >
      ← Tilbake til boliger
    </button>

  </section>



  <!-- =====================================================
       ADD FLOOR
       ===================================================== -->

  <section class="dashboard-card">

    <h2>
      Legg til etasje
    </h2>


    <p>
      Opprett en etasje for denne boligen.
    </p>


    <form id="floorForm">


      <div class="form-group">

        <label for="floorNumber">
          Etasjenummer
        </label>


        <input
                id="floorNumber"
                name="floorNumber"
                type="number"
                min="1"
                step="1"
                required
        >

      </div>



      <div class="form-group">

        <label for="floorName">
          Navn på etasje
        </label>


        <input
                id="floorName"
                name="floorName"
                type="text"
                placeholder="For eksempel 1. etasje"
                maxlength="100"
                required
        >

      </div>


      <button
              id="saveFloorButton"
              class="primary-button"
              type="submit"
      >
        Lagre etasje
      </button>


      <p
              id="floorMessage"
              class="message"
      ></p>

    </form>

  </section>



  <!-- =====================================================
       FLOORS LIST
       ===================================================== -->

  <section class="dashboard-card">

    <div class="section-header">

      <div>

        <h2>
          Etasjer
        </h2>


        <p>
          Registrerte etasjer
        </p>

      </div>

    </div>


    <div id="floorList">

      <p class="empty-state">
        Laster etasjer...
      </p>

    </div>

  </section>


</main>



<!-- =========================================================
     SUPABASE
     ========================================================= -->

<script
        src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>


<script src="js/config.js"></script>


<!-- =========================================================
     FLOORS JAVASCRIPT
     ========================================================= -->

<script src="js/floors.js"></script>


</body>

</html>
```
