
<!DOCTYPE html>
<html lang="no">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0"
    >

    <title>Sett passord | Cleaning Schedule</title>

    <link
            rel="stylesheet"
            href="css/style.css"
    >

</head>


<body>


<!-- ============================================================
     TOPBAR
     ============================================================ -->

<header class="topbar">

    <div class="brand">

        <span class="brand-icon">
            🧹
        </span>

        <span>
            Cleaning Schedule
        </span>

    </div>

</header>



<!-- ============================================================
     MAIN
     ============================================================ -->

<main class="dashboard">


    <section class="welcome-section">

        <p class="eyebrow">
            KONTOOPPSETT
        </p>

        <h1>
            Sett passord
        </h1>

        <p class="welcome-text">
            Velg et passord for kontoen din.
        </p>

    </section>



    <!-- ========================================================
         PASSWORD CARD
         ======================================================== -->

    <section class="dashboard-card">


        <div class="card-icon">
            🔐
        </div>


        <h2>
            Opprett passord
        </h2>


        <p>
            Skriv inn et nytt passord og bekreft det
            for å fullføre oppsettet av kontoen din.
        </p>



        <!-- ====================================================
             FORM
             ==================================================== -->

        <form id="resetPasswordForm">


            <!-- ==================================================
                 NEW PASSWORD
                 ================================================== -->

            <div class="form-group">

                <label for="newPassword">
                    Nytt passord
                </label>

                <input
                        type="password"
                        id="newPassword"
                        name="newPassword"
                        autocomplete="new-password"
                        required
                >

            </div>



            <!-- ==================================================
                 CONFIRM PASSWORD
                 ================================================== -->

            <div
                    class="form-group"
                    style="margin-top: 18px;"
            >

                <label for="confirmPassword">
                    Bekreft passord
                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        autocomplete="new-password"
                        required
                >

            </div>



            <!-- ==================================================
                 PASSWORD REQUIREMENTS
                 ================================================== -->

            <div
                    class="password-requirements"
                    style="
                    margin-top: 15px;
                    color: #667085;
                    font-size: 13px;
                    line-height: 1.5;
                "
            >

                Passordet må være minst 8 tegn.

            </div>



            <!-- ==================================================
                 MESSAGE
                 ================================================== -->

            <div
                    id="resetPasswordMessage"
                    class="message"
                    role="alert"
                    aria-live="polite"
            ></div>



            <!-- ==================================================
                 BUTTON
                 ================================================== -->

            <div
                    style="
                    margin-top: 22px;
                "
            >

                <button
                        type="submit"
                        id="resetPasswordButton"
                        class="primary-button"
                >
                    Lagre passord
                </button>

            </div>


        </form>


    </section>


</main>



<!-- ============================================================
     SUPABASE
     ============================================================ -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- ============================================================
     SUPABASE CONFIG
     ============================================================ -->

<script src="js/config.js"></script>


<!-- ============================================================
     RESET PASSWORD
     ============================================================ -->

<script src="js/reset-password.js"></script>


</body>

</html>
